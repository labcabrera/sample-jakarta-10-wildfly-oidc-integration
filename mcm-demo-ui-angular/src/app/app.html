<app-header-component [title]="title"></app-header-component>

<div class="main-content" *ngIf="auth.isLoggedIn$ | async">
  <a mat-button routerLink="/customers">Customers</a>
  <div>
    OIDC User Profile:
    <pre><code>{{ auth.userProfile | json }}</code></pre>
  </div>
  <div>
    JWT Token:
    <code>{{auth.token}}</code>
  </div>
</div>

<router-outlet />
