<h2>Customer search</h2>

<button mat-raised-button color="primary" (click)="buscar()">Buscar clientes</button>

<table mat-table [dataSource]="customers" class="mat-elevation-z8" *ngIf="customers?.length">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let customer"> {{ customer.id }} </td>
  </ng-container>

  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let customer"> {{ customer.firstName }} </td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef> Last Name </th>
    <td mat-cell *matCellDef="let customer"> {{ customer.lastName }} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let customer"> {{ customer.contactInfo.email }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['id', 'firstName', 'lastName', 'email']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['id', 'firstName', 'lastName', 'email'];"></tr>

</table>

<pre>
{{ customers | json }}
</pre>
