plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.davidmc24.gradle.plugin.avro' version '1.8.0'
	id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.mcm.demo'
version = version

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	gradlePluginPortal()
	maven {
		url "https://packages.confluent.io/maven"
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-stream-kafka'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.4'

	implementation 'org.apache.avro:avro:1.11.1'
	//implementation "io.confluent:kafka-avro-serializer:7.5.0"

	implementation 'io.confluent:kafka-avro-serializer:7.5.0'
    implementation 'io.confluent:kafka-schema-registry-client:7.5.0'
    implementation 'io.confluent:kafka-streams-avro-serde:7.5.0'

	// implementation 'com.google.code.gson:gson:2.10.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	//testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

avro {
    createSetters = false
    stringType = "String"
    fieldVisibility = "PRIVATE"
    outputCharacterEncoding = "UTF-8"
    templateDirectory = null
    enableDecimalLogicalType = true
}

generateAvroJava {
    source file("src/main/resources/avro/schemas")
    setOutputDir(file("build/generated-sources/avro"))
}

sourceSets {
    main {
        java {
			srcDir("src/main/java")
            srcDir("build/generated-sources/avro")
        }
    }
}

compileJava.dependsOn generateAvroJava

tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}

sonarqube {
	properties {
		property "sonar.host.url",   System.getenv("SONARQUBE_URL")
		property "sonar.login",      System.getenv("SONARQUBE_USERNAME")
		property "sonar.password",   System.getenv("SONARQUBE_PASSWORD")
	}
}
