spring:
  application:
    name: mcm-demo-consumer-customers-activation
  main:
    # Note: We start the web server only for actuator endpoints. If you do not want
    # this functionality, use the 'none' mode
    web-application-type: reactive
  cloud:
    stream:
      bindings:
        customerCreated-in-0:
          destination: ${APP_KAFKA_TOPIC_CUSTOMER_CREATED:customers-created-topic}
          group: ${APP_KAFKA_CONSUMER_GROUP:customer-consumers-activation-group}
          content-type: application/*+avro
          consumer:
            enableDlq: true
            dlqName: ${APP_KAFKA_DLQ_NAME:customers-created-topic-dlt}
            max-attempts: 3
      kafka:
        binder:
          brokers: ${APP_KAFKA_BROKER:192.168.49.2:31101}
          configuration:
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: PLAIN
            sasl.jaas.config: >
              org.apache.kafka.common.security.plain.PlainLoginModule required
              username="${APP_KAFKA_USERNAME:user1}"
              password="${APP_KAFKA_PASSWORD:gWXJezKXhm}";
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
            schema.registry.url: ${APP_SCHEMA_REGISTRY_URL:http://schema-registry.local}
            specific.avro.reader: true
            
  security:
    oauth2:
      client:
        registration:
          demo-keycloak:
            client-id: ${APP_CLIENT_ID:mcm-demo-customer-consumer}
            client-secret: ${APP_CLIENT_SECRET:2wvBjlhSDHVIR6UVfA05TZ0yOPfmFiCn}
            authorization-grant-type: client_credentials
            scope: openid
            provider: demo-keycloak
        provider:
          demo-keycloak:
            token-uri: ${APP_TOKEN_URL:http://127.0.0.1:8090/realms/mcm-demo/protocol/openid-connect/token}
app:
  api-client: 
    customers:
      base-url: ${APP_CUSTOMER_API_URL:http://mcm-demo-api-customers.local/api-customers/api}

logging:
  level:
    root: INFO
    com.mcm.demo.customers.consumer: DEBUG
