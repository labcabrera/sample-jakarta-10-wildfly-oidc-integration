apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcm-demo-api-customers
  labels:
    k8s-app: mcm-demo-api-customers
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: mcm-demo-api-customers
  template:
    metadata:
      labels:
        k8s-app: mcm-demo-api-customers
    spec:
      imagePullSecrets:
      - name: registrykey
      containers:
      - name: mcm-demo-api-customers
        image: {{DOCKER_REGISTRY}}
        env:
        - name: SAMPLE_APP_PROPERTY
          valueFrom:
            configMapKeyRef:
              name: mcm-java-properties
              key: SAMPLE_APP_PROPERTY
        - name: SAMPLE_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: mcm-java-secrets
              key: APP_MONGO_REPLICA
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: mcm-java-config
              key: JAVA_OPTS
        - name: TZ
          value: Europe/Madrid
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: web
          protocol: TCP
