apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcm-demo-apps-monitor
  labels:
    app: mcm-demo
    release: prometheus
spec:
  selector:
    matchLabels:
      app: mcm-demo-consumer-customers-activation
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
  namespaceSelector:
    matchNames:
    - apps-local
    - default