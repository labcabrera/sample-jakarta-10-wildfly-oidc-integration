apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcm-demo-kafka-ui
  namespace: mcm-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcm-demo-kafka-ui
  template:
    metadata:
      labels:
        app: mcm-demo-kafka-ui
    spec:
      containers:
        - name: mcm-demo-kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "kafka"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
            #- name: KAFKA_CLUSTERS_0_ZOOKEEPER
            #  value: "<zookeeper-host>:2181"
---
apiVersion: v1
kind: Service
metadata:
  name: mcm-demo-kafka-ui
  namespace: mcm-dev
spec:
  type: NodePort
  selector:
    app: mcm-demo-kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30077


