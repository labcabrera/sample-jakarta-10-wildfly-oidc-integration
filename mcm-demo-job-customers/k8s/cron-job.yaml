apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcm-demo-job-customers
  labels:
    app: mcm-demo-job-customers
    component: batch-job
    version: v1.0.0
  annotations:
    description: "Job to process pending customer activations"
    maintainer: "MCM Demo Team"
spec:
  schedule: "*/30 * * * *"
  timeZone: "Europe/Madrid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        app: mcm-demo-job-customers
        component: batch-job
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: mcm-demo-job-customers
            component: batch-job
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: mcm-demo-job-customers
            image: labcabrera/mcm-demo-job-customers:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                memory: "128Mi"
              limits:
                memory: "512Mi"
            envFrom:
            - configMapRef:
                name: mcm-demo-config-map-client-jsf
            - configMapRef:
                name: mcm-demo-config-map-kafka
            - configMapRef:
                name: mcm-demo-config-map-db
            - configMapRef:
                name: mcm-demo-config-map-client-consumer
            - secretRef:
                name: mcm-demo-secrets-client-consumer
            - secretRef:
                name: mcm-demo-secrets-kafka
            - secretRef:
                name: mcm-demo-secrets-db
            env:
            - name: TZ
              value: Europe/Madrid
            # - name: APP_DB_SCHEMA
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_DB_SCHEMA
            # - name: APP_DB_USERNAME
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_DB_USERNAME
            # - name: APP_DB_HOST
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_DB_HOST
            # - name: APP_DB_PORT
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_DB_PORT
            # - name: APP_KAFKA_BROKER
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_KAFKA_BROKER
            # - name: APP_KAFKA_USERNAME
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_KAFKA_USERNAME
            # - name: APP_KAFKA_TOPIC_CUSTOMER_CREATED
            #   valueFrom:
            #     configMapKeyRef:
            #       name: mcm-demo-config-map
            #       key: APP_KAFKA_TOPIC_CUSTOMER_CREATED
            # - name: APP_DB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: mcm-demo-secrets
            #       key: APP_DB_PASSWORD
            # - name: APP_KAFKA_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: mcm-demo-secrets
            #       key: APP_KAFKA_PASSWORD
            livenessProbe:
              exec:
                command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep python"
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              exec:
                command:
                - /bin/sh
                - -c
                - "ps aux | grep -v grep | grep python"
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
